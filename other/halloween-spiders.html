<style>

<canvas id="c"></canvas>

<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const flashEl = document.getElementById('flash');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);

let W, H, Q, S;
let webs = [], crawlers = [], danglers = [], fog = [];
let fogSprite, glowSprite, bgCanvas;
let flash = 0, nextFlash = 0, flashQueue = [], lastFlashOpacity = -1;

/* ---------- pre-rendered sprites ---------- */
function radialSprite(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, col] of stops) grd.addColorStop(o, col);
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return c;
}
function makeBackground() {
  const c = document.createElement('canvas');
  c.width = Math.round(W * Q); c.height = Math.round(H * Q);
  const g = c.getContext('2d'); g.scale(Q, Q);
  g.fillStyle = '#070000'; g.fillRect(0, 0, W, H);
  const R = Math.max(W, H) * 0.8;
  const grd = g.createRadialGradient(W / 2, H * 0.58, 0, W / 2, H * 0.58, R);
  grd.addColorStop(0, 'rgba(150,0,14,0.78)');
  grd.addColorStop(0.45, 'rgba(70,0,8,0.6)');
  grd.addColorStop(1, 'rgba(20,0,2,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  return c;
}
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 200;
  const g = c.getContext('2d');
  const img = g.createImageData(200, 200);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v; img.data[i + 1] = v * 0.6; img.data[i + 2] = v * 0.6; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
}

/* ---------- webs (baked once into sprites) ---------- */
function makeWeb(hx, hy, R, n, rings) {
  const off = rand(0, TAU), spokes = [];
  for (let i = 0; i < n; i++) spokes.push({ a: off + i / n * TAU + rand(-0.12, 0.12), len: R * rand(0.8, 1.15) });
  const p = new Path2D(), dews = [];
  for (const s of spokes) { p.moveTo(0, 0); p.lineTo(Math.cos(s.a) * s.len, Math.sin(s.a) * s.len); }
  for (let r = 1; r <= rings; r++) {
    const base = R * (0.07 + 0.93 * Math.pow(r / rings, 1.15));
    for (let i = 0; i < n; i++) {
      if (Math.random() < 0.07) continue;            // torn gaps
      const j = (i + 1) % n;
      const r1 = base * rand(0.95, 1.05), r2 = base * rand(0.95, 1.05);
      if (r1 > spokes[i].len || r2 > spokes[j].len) continue;
      const ax = Math.cos(spokes[i].a) * r1, ay = Math.sin(spokes[i].a) * r1;
      const bx = Math.cos(spokes[j].a) * r2, by = Math.sin(spokes[j].a) * r2;
      const sag = rand(0.12, 0.24);
      const cx = (ax + bx) / 2 * (1 - sag), cy = (ay + by) / 2 * (1 - sag);
      p.moveTo(ax, ay); p.quadraticCurveTo(cx, cy, bx, by);
      if (Math.random() < 0.07) dews.push([0.25 * ax + 0.5 * cx + 0.25 * bx, 0.25 * ay + 0.5 * cy + 0.25 * by, rand(0, TAU)]);
    }
  }
  const loose = [];
  for (let k = 0; k < 3; k++) {
    const s = spokes[Math.floor(rand(0, n))], r = R * rand(0.35, 0.9);
    loose.push({ x: Math.cos(s.a) * r, y: Math.sin(s.a) * r, len: R * rand(0.15, 0.4), ph: rand(0, TAU) });
  }
  // bake
  const pad = R * 1.2;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(pad * 2 * Q);
  const g = c.getContext('2d');
  g.setTransform(Q, 0, 0, Q, pad * Q, pad * Q);
  const lw = Math.max(0.7, S * 0.0012);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(200,10,20,0.16)'; g.lineWidth = lw * 4; g.stroke(p);
  g.strokeStyle = 'rgba(235,180,180,0.36)'; g.lineWidth = lw; g.stroke(p);
  return { hx, hy, pad, sprite: c, dews, loose, lw, ph: rand(0, TAU) };
}
function drawWeb(w, t, glow) {
  ctx.save();
  ctx.translate(w.hx, w.hy);
  ctx.rotate(Math.sin(t * 0.45 + w.ph) * 0.012);
  const sc = 1 + Math.sin(t * 0.31 + w.ph * 1.7) * 0.006;
  ctx.scale(sc, sc);
  ctx.drawImage(w.sprite, -w.pad, -w.pad, w.pad * 2, w.pad * 2);
  if (glow > 0.03) {                                   // lightning lights up the silk
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(1, glow * 1.4);
    ctx.drawImage(w.sprite, -w.pad, -w.pad, w.pad * 2, w.pad * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  // loose dangling threads
  ctx.strokeStyle = 'rgba(235,180,180,0.36)'; ctx.lineWidth = w.lw;
  ctx.beginPath();
  for (const l of w.loose) {
    const sw = Math.sin(t * 0.9 + l.ph) * l.len * 0.25;
    ctx.moveTo(l.x, l.y);
    ctx.quadraticCurveTo(l.x + sw * 0.3, l.y + l.len * 0.5, l.x + sw, l.y + l.len);
  }
  ctx.stroke();
  // dewdrop glints
  for (const d of w.dews) {
    const a = 0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(t * 1.6 + d[2])), 4);
    ctx.fillStyle = `rgba(255,70,70,${a})`;
    ctx.beginPath(); ctx.arc(d[0], d[1], w.lw * 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- spiders ---------- */
// Body space: +x = forward, +y = right. Units are multiples of the spider's size.
// Legs indexed 0-3 = left (front to back), 4-7 = right (front to back).
const ROOT = [[0.34, 0.13], [0.22, 0.16], [0.08, 0.16], [-0.04, 0.13]];   // hips
const REST = [[1.6, 1.05], [0.65, 1.5], [-0.45, 1.5], [-1.5, 1.1]];       // relaxed feet
const KINK = [1, 1, -1, -1];          // front legs bend forward, back legs bend backward
const STRIDE = 0.6;                   // total fore-aft foot travel (smaller than the gap between feet)

// Gaits: phase offset per leg (0..1) and how much of the cycle each foot spends on the ground
const GAITS = {
  pairs: { name: 'Gait: pairs (wave)', duty: 0.75,
           offset: (s, i) => ((3 - i) * 0.25 + (s > 0 ? 0.5 : 0)) % 1 },
  sides: { name: 'Gait: sides (four per side)', duty: 0.5,
           offset: (s, i) => (s > 0 ? 0.5 : 0) },
  fours: { name: 'Gait: alternating fours', duty: 0.5,
           offset: (s, i) => ((i + (s > 0 ? 1 : 0)) % 2) * 0.5 }
};
const GAIT_ORDER = ['pairs', 'sides', 'fours'];
let gaitKey = 'pairs';
const smooth = p => p * p * (3 - 2 * p);

// Foot positions (body space) for a phase-driven walk cycle
function walkFeet(size, phase, liftAmt, tw) {
  const G = GAITS[gaitKey], feet = [], lifts = [];
  for (let n = 0; n < 8; n++) {
    const s = n < 4 ? -1 : 1, i = n % 4;
    let p = (phase + G.offset(s, i)) % 1;
    let x, lift = 0;
    if (p < G.duty) {                       // planted: foot slides back as the body passes over it
      x = STRIDE * (0.5 - p / G.duty);
    } else {                                // swinging: foot lifts and moves forward
      const u = (p - G.duty) / (1 - G.duty);
      x = STRIDE * (-0.5 + smooth(u));
      lift = Math.sin(Math.PI * u) * liftAmt;
    }
    feet.push([(REST[i][0] + x + (tw ? tw[n] * 0.15 : 0)) * size, s * REST[i][1] * size]);
    lifts.push(lift);
  }
  return { feet, lifts };
}

function drawSpider(x, y, heading, size, feet, lifts, t) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(heading);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(-size * 0.05, size * 0.45, size * 1.4, size * 0.9, 0, 0, TAU); ctx.fill();

  // legs: hip -> knee -> foot. Knee sits near the middle, nudged into the leg's own lane.
  ctx.strokeStyle = '#140103'; ctx.lineWidth = Math.max(1, size * 0.11);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let n = 0; n < 8; n++) {
    const s = n < 4 ? -1 : 1, i = n % 4;
    const rx = ROOT[i][0] * size, ry = s * ROOT[i][1] * size;
    const lift = lifts ? lifts[n] : 0;
    // a raised foot looks a little closer to the body from above
    const fx = rx + (feet[n][0] - rx) * (1 - 0.12 * lift);
    const fy = ry + (feet[n][1] - ry) * (1 - 0.12 * lift);
    const dx = fx - rx, dy = fy - ry, d = Math.hypot(dx, dy) || 1;
    let px = -dy / d, py = dx / d;                         // perpendicular to the leg
    if (Math.sign(px) !== KINK[i]) { px = -px; py = -py; } // point it into this leg's lane
    const k = size * (0.16 + 0.18 * lift);
    const kx = rx + dx * 0.5 + px * k, ky = ry + dy * 0.5 + py * k;
    ctx.moveTo(rx, ry); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy);
  }
  ctx.stroke();

  // abdomen
  const breathe = 1 + Math.sin(t * 2.2 + size) * 0.03;
  let g = ctx.createRadialGradient(-size * 0.95, -size * 0.25, size * 0.05, -size * 0.75, 0, size * 0.85);
  g.addColorStop(0, '#4a060c'); g.addColorStop(1, '#0a0001');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(-size * 0.75, 0, size * 0.78 * breathe, size * 0.6 * breathe, 0, 0, TAU); ctx.fill();
  // hourglass mark
  ctx.fillStyle = 'rgba(210,15,25,0.85)';
  ctx.beginPath();
  ctx.moveTo(-size * 1.05, -size * 0.13); ctx.lineTo(-size * 1.05, size * 0.13); ctx.lineTo(-size * 0.8, 0);
  ctx.moveTo(-size * 0.55, -size * 0.13); ctx.lineTo(-size * 0.55, size * 0.13); ctx.lineTo(-size * 0.8, 0);
  ctx.fill();
  // cephalothorax
  g = ctx.createRadialGradient(size * 0.15, -size * 0.12, size * 0.03, size * 0.2, 0, size * 0.45);
  g.addColorStop(0, '#3a0408'); g.addColorStop(1, '#0a0001');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(size * 0.2, 0, size * 0.42, size * 0.35, 0, 0, TAU); ctx.fill();
  // eyes: soft halo + bright core
  ctx.fillStyle = 'rgba(255,30,30,0.3)';
  ctx.beginPath();
  ctx.arc(size * 0.5, -size * 0.11, size * 0.15, 0, TAU);
  ctx.arc(size * 0.5, size * 0.11, size * 0.15, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#ff3a3a';
  ctx.beginPath();
  ctx.arc(size * 0.5, -size * 0.11, size * 0.065, 0, TAU);
  ctx.moveTo(size * 0.565, size * 0.11);
  ctx.arc(size * 0.5, size * 0.11, size * 0.065, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ----- crawling spiders ----- */
function spawnCrawler(c, inside) {
  c.size = S * rand(0.011, 0.022);
  c.max = c.size * rand(2.5, 4.5);
  c.v = 0; c.pause = 0; c.burst = 0; c.timer = rand(1, 3);
  c.gp = rand(0, 1); c.tw = new Array(8).fill(0);
  const m = c.size * 4;
  if (inside) { c.x = rand(0, W); c.y = rand(0, H); c.h = rand(0, TAU); }
  else {
    const e = Math.floor(rand(0, 4));
    c.x = e === 0 ? -m : e === 1 ? W + m : rand(0, W);
    c.y = e === 2 ? -m : e === 3 ? H + m : rand(0, H);
    c.h = Math.atan2(H / 2 - c.y, W / 2 - c.x) + rand(-0.6, 0.6);
  }
  c.target = c.h;
  return c;
}
function updateCrawler(c, dt) {
  c.timer -= dt;
  if (c.timer <= 0) {
    const r = Math.random();
    if (r < 0.35) c.pause = rand(0.8, 3);
    else if (r < 0.5) c.burst = rand(0.4, 0.9);
    c.target = c.h + rand(-1.3, 1.3);
    c.timer = rand(1.5, 4);
  }
  let want = c.max;
  if (c.pause > 0) { c.pause -= dt; want = 0; }
  else if (c.burst > 0) { c.burst -= dt; want = c.max * 3; }
  c.v += (want - c.v) * Math.min(1, dt * 4);
  c.h += (c.target - c.h) * Math.min(1, dt * 1.5);
  c.x += Math.cos(c.h) * c.v * dt; c.y += Math.sin(c.h) * c.v * dt;
  // advance the walk cycle so planted feet move backward exactly as fast as the body moves forward
  const G = GAITS[gaitKey];
  c.gp = (c.gp + c.v * dt * G.duty / (STRIDE * c.size)) % 1;
  // nervous single-leg twitches while standing still
  for (let n = 0; n < 8; n++) c.tw[n] *= Math.pow(0.03, dt);
  if (c.pause > 0 && Math.random() < dt * 1.0) c.tw[Math.floor(rand(0, 8))] = rand(-1, 1);
  const m = c.size * 6;
  if (c.x < -m || c.x > W + m || c.y < -m || c.y > H + m) spawnCrawler(c, false);
}
function drawCrawler(c, t) {
  const liftAmt = Math.min(1, c.v / c.size);
  const { feet, lifts } = walkFeet(c.size, c.gp, liftAmt, c.tw);
  drawSpider(c.x, c.y, c.h, c.size, feet, lifts, t);
}

/* ----- dangling spiders ----- */
function spawnDangler(d) {
  d.size = S * rand(0.014, 0.024);
  d.x = rand(W * 0.12, W * 0.88);
  d.y = -d.size * 3;
  d.target = rand(H * 0.18, H * 0.6);
  d.state = 'wait'; d.wait = rand(0.5, 8);
  d.ph = rand(0, TAU); d.gp = 0;
  d.tw = new Array(8).fill(0);
  return d;
}
function updateDangler(d, dt, t) {
  for (let n = 0; n < 8; n++) d.tw[n] *= Math.pow(0.03, dt);
  if (d.state === 'wait') { d.wait -= dt; if (d.wait <= 0) d.state = 'down'; return; }
  if (d.state === 'down') {
    d.y += S * 0.07 * dt * (0.6 + 0.4 * Math.sin(t * 3 + d.ph) ** 2);
    d.gp = (d.gp + dt * 1.2) % 1;
    if (d.y >= d.target) { d.state = 'hang'; d.hang = rand(5, 11); }
  } else if (d.state === 'hang') {
    d.hang -= dt;
    if (Math.random() < dt * 0.8) d.tw[Math.floor(rand(0, 8))] = rand(-1, 1);
    if (d.hang <= 0) d.state = 'up';
  } else if (d.state === 'up') {
    d.y -= S * 0.11 * dt;
    d.gp = (d.gp + dt * 2) % 1;
    if (d.y < -d.size * 4) spawnDangler(d);
  }
}
function drawDangler(d, t) {
  if (d.state === 'wait') return;
  const bob = d.state === 'hang' ? Math.sin(t * 1.3 + d.ph) * d.size * 0.4 : 0;
  const swing = Math.sin(t * 0.8 + d.ph) * d.size * 0.7;
  const x = d.x + swing, y = d.y + bob;
  ctx.strokeStyle = 'rgba(235,180,180,0.45)'; ctx.lineWidth = Math.max(0.7, S * 0.001);
  ctx.beginPath(); ctx.moveTo(d.x, 0); ctx.lineTo(x, y - d.size * 1.5); ctx.stroke();
  // moving on the thread: legs cycle; hanging: legs still, with twitches
  const moving = d.state !== 'hang';
  const { feet, lifts } = walkFeet(d.size, d.gp, moving ? 0.6 : 0, d.tw);
  drawSpider(x, y, Math.PI / 2 - Math.sin(t * 0.8 + d.ph) * 0.08, d.size, feet, lifts, t);
}

/* ---------- build & resize ---------- */
function build() {
  bgCanvas = makeBackground();
  webs = [
    makeWeb(S * 0.06, S * 0.05, S * 0.44, 16, 14),
    makeWeb(W - S * 0.05, S * 0.06, S * 0.36, 15, 12),
    makeWeb(S * 0.03, H - S * 0.04, S * 0.24, 13, 9),
    makeWeb(W - S * 0.07, H - S * 0.05, S * 0.3, 14, 11)
  ];
  const n = Math.min(12, Math.round(5 + (W * H) / 260000));
  crawlers = Array.from({ length: n }, () => spawnCrawler({}, true));
  danglers = Array.from({ length: 3 }, () => spawnDangler({}));
  fog = Array.from({ length: 5 }, () => ({ x: rand(0, W), y: rand(0, H), r: S * rand(0.45, 0.9), vx: S * rand(-0.02, 0.02), vy: S * rand(-0.006, 0.006), a: rand(0.35, 0.7) }));
}
function resize() {
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  // render at most ~1080p worth of pixels; the browser upscales for 4K TVs
  Q = Math.min(window.devicePixelRatio || 1, 2, 1920 / W, 1080 / H);
  cv.width = Math.round(W * Q); cv.height = Math.round(H * Q);
  ctx.setTransform(Q, 0, 0, Q, 0, 0);
  build();
}

/* ---------- heartbeat ---------- */
function beat(t) {
  const p = t % 1.7;
  return Math.exp(-p * 9) + (p > 0.28 ? 0.6 * Math.exp(-(p - 0.28) * 9) : 0);
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  // cached background + heartbeat glow
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  const b = beat(t);
  ctx.globalCompositeOperation = 'lighter';
  const gr = Math.max(W, H) * 0.55;
  ctx.globalAlpha = b * 0.35;
  ctx.drawImage(glowSprite, W / 2 - gr, H * 0.58 - gr, gr * 2, gr * 2);

  // drifting fog
  for (const f of fog) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < -f.r) f.x = W + f.r; else if (f.x > W + f.r) f.x = -f.r;
    if (f.y < -f.r) f.y = H + f.r; else if (f.y > H + f.r) f.y = -f.r;
    ctx.globalAlpha = f.a * (0.8 + 0.2 * Math.sin(t * 0.3 + f.r));
    ctx.drawImage(fogSprite, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // lightning flicker
  if (t > nextFlash) {
    flashQueue = [0, 0.12, 0.3].map(o => t + o).slice(0, Math.random() < 0.5 ? 2 : 3);
    nextFlash = t + rand(18, 40);
  }
  if (flashQueue.length && t >= flashQueue[0]) { flash = rand(0.6, 1); flashQueue.shift(); }
  flash *= Math.pow(0.004, dt);

  for (const w of webs) drawWeb(w, t, flash);
  for (const d of danglers) { updateDangler(d, dt, t); drawDangler(d, t); }
  for (const c of crawlers) {
    updateCrawler(c, dt);
    drawCrawler(c, t);
  }

  const fo = flash > 0.01 ? Math.round(flash * 160) / 1000 : 0;
  if (fo !== lastFlashOpacity) { flashEl.style.opacity = fo; lastFlashOpacity = fo; }

  requestAnimationFrame(frame);
}

/* ---------- controls: fullscreen, idle cursor, keep screen awake ---------- */
const hint = document.getElementById('hint');
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  if (!document.fullscreenElement) hint.style.opacity = 1;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.body.classList.add('idle'); hint.style.opacity = 0; }, 3000);
}
async function goFull() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  hint.style.opacity = 0;
}
addEventListener('mousemove', wake);
addEventListener('click', goFull);
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') goFull();
  if (e.key === 'g' || e.key === 'G') {
    gaitKey = GAIT_ORDER[(GAIT_ORDER.indexOf(gaitKey) + 1) % GAIT_ORDER.length];
    hint.textContent = GAITS[gaitKey].name;
    hint.style.opacity = 1;
    clearTimeout(hint._t);
    hint._t = setTimeout(() => { hint.style.opacity = 0; hint.textContent = 'Click or press F for fullscreen'; }, 1800);
  }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && document.fullscreenElement) {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});
