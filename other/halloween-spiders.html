/* ---------- spiders ---------- */
// Body space: +x = forward, +y = right. Units are multiples of the spider's size.
// Legs indexed 0-3 = left (front to back), 4-7 = right (front to back).
const ROOT = [[0.34, 0.13], [0.22, 0.16], [0.08, 0.16], [-0.04, 0.13]];   // hips
const REST = [[1.6, 1.05], [0.65, 1.5], [-0.45, 1.5], [-1.5, 1.1]];       // relaxed feet
const KINK = [1, 1, -1, -1];          // front legs bend forward, back legs bend backward

// Gaits: phase offset per leg (0..1) and how much of the cycle each foot spends on the ground

  pairs: { name: 'Gait: pairs (wave)', duty: 0.75,

    if (d.hang <= 0) {
      // let go: spider starts falling with the sideways speed of its sway
      const P = danglerPose(d, t);
      d.fall = { x: P.x, y: P.y, h: P.heading, vx: Math.cos(t * 0.8 + d.ph) * 0.56 * d.size, vy: 0, spin: rand(-2.2, 2.2) };
      d.rope = makeRope(d, P);
      d.state = 'drop';
    }
  } else if (d.state === 'drop') {
    if (d.fall) {
      const f = d.fall;
      f.vy += S * 1.1 * dt;                        // gravity
      f.x += f.vx * dt; f.y += f.vy * dt; f.h += f.spin * dt;
      if (f.y > H + d.size * 5) d.fall = null;
    }
    if (d.rope && updateRope(d.rope, d, dt, t)) d.rope = null;
    if (!d.fall && !d.rope) spawnDangler(d);
  }
}

function drawDangler(d, t) {
  if (d.state === 'wait') return;
  ctx.strokeStyle = 'rgba(235,180,180,0.45)'; ctx.lineWidth = Math.max(0.7, S * 0.001);
  if (d.state === 'drop') {
    if (d.rope) {
      const p = d.rope.pts;
      ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
      for (let k = 1; k < p.length - 1; k++) {
        ctx.quadraticCurveTo(p[k].x, p[k].y, (p[k].x + p[k + 1].x) / 2, (p[k].y + p[k + 1].y) / 2);
      }
      ctx.lineTo(p[p.length - 1].x, p[p.length - 1].y);
      ctx.stroke();
    }
    if (d.fall) {
      // legs splayed and flailing as it falls
      const feet = [];
      for (let n = 0; n < 8; n++) {
        const s = n < 4 ? -1 : 1, i = n % 4;
        feet.push([(REST[i][0] + Math.sin(t * 18 + n * 1.7) * 0.12) * d.size,
                   s * (REST[i][1] * 1.05 + Math.cos(t * 15 + n * 2.3) * 0.08) * d.size]);
      }
      drawSpider(d.fall.x, d.fall.y, d.fall.h, d.size, feet, null, t);
    }
    return;
  }
  const P = danglerPose(d, t);
  ctx.beginPath(); ctx.moveTo(d.x, 0); ctx.lineTo(P.ax, P.ay); ctx.stroke();
  // legs held still in a relaxed pose, with occasional twitches
  const feet = [];
  for (let n = 0; n < 8; n++) {
    const s = n < 4 ? -1 : 1, i = n % 4;
    feet.push([(REST[i][0] * 0.9 + d.tw[n] * 0.15) * d.size, s * REST[i][1] * 0.85 * d.size]);
  }
  drawSpider(P.x, P.y, P.heading, d.size, feet, null, t);
}

/* ---------- build & resize ---------- */
function build() {
  bgCanvas = makeBackground();
  webs = [
    makeWeb(S * 0.06, S * 0.05, S * 0.44, 16, 14),
    makeWeb(W - S * 0.05, S * 0.06, S * 0.36, 15, 12),
    makeWeb(S * 0.03, H - S * 0.04, S * 0.24, 13, 9),
    makeWeb(W - S * 0.07, H - S * 0.05, S * 0.3, 14, 11)
  ];
  const n = Math.min(12, Math.round(5 + (W * H) / 260000));
  crawlers = Array.from({ length: n }, () => spawnCrawler({}, true));
  danglers = Array.from({ length: 3 }, () => spawnDangler({}));
  fog = Array.from({ length: 5 }, () => ({ x: rand(0, W), y: rand(0, H), r: S * rand(0.45, 0.9), vx: S * rand(-0.02, 0.02), vy: S * rand(-0.006, 0.006), a: rand(0.35, 0.7) }));
}
function resize() {
  W = innerWidth; H = innerHeight; S = Math.min(W, H);
  // render at most ~1080p worth of pixels; the browser upscales for 4K TVs
  Q = Math.min(window.devicePixelRatio || 1, 2, 1920 / W, 1080 / H);
  cv.width = Math.round(W * Q); cv.height = Math.round(H * Q);
  ctx.setTransform(Q, 0, 0, Q, 0, 0);
  low.width = Math.ceil(W * LOW); low.height = Math.ceil(H * LOW);
  lctx.setTransform(LOW, 0, 0, LOW, 0, 0);
  bodyCache.clear();
  build();
}

/* ---------- heartbeat ---------- */
function beat(t) {
  const p = t % 1.7;
  return Math.exp(-p * 9) + (p > 0.28 ? 0.6 * Math.exp(-(p - 0.28) * 9) : 0);
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  // atmosphere: background + heartbeat glow + fog, composed in the small buffer
  lctx.drawImage(bgCanvas, 0, 0, W, H);
  const b = beat(t);
  lctx.globalCompositeOperation = 'lighter';
  const gr = Math.max(W, H) * 0.55;
  lctx.globalAlpha = b * 0.35;
  lctx.drawImage(glowSprite, W / 2 - gr, H * 0.58 - gr, gr * 2, gr * 2);

  // drifting fog
  for (const f of fog) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < -f.r) f.x = W + f.r; else if (f.x > W + f.r) f.x = -f.r;
    if (f.y < -f.r) f.y = H + f.r; else if (f.y > H + f.r) f.y = -f.r;
    lctx.globalAlpha = f.a * (0.8 + 0.2 * Math.sin(t * 0.3 + f.r));
    lctx.drawImage(fogSprite, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
  }
  lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(low, 0, 0, W, H);              // one upscaled draw for the whole backdrop

  // lightning flicker
  if (t > nextFlash) {
    flashQueue = [0, 0.12, 0.3].map(o => t + o).slice(0, Math.random() < 0.5 ? 2 : 3);
    nextFlash = t + rand(18, 40);
  }
  if (flashQueue.length && t >= flashQueue[0]) { flash = rand(0.6, 1); flashQueue.shift(); }
  flash *= Math.pow(0.004, dt);

  for (const w of webs) drawWeb(w, t, flash);
  for (const d of danglers) updateDangler(d, dt, t);
  avoidCollisions();
  for (const c of crawlers) {
    updateCrawler(c, dt);
    drawCrawler(c, t);
  }
  // hanging spiders are drawn last, so crawlers pass underneath their threads
  for (const d of danglers) drawDangler(d, t);

  const fo = flash > 0.01 ? Math.round(flash * 160) / 1000 : 0;
  if (fo !== lastFlashOpacity) { flashEl.style.opacity = fo; lastFlashOpacity = fo; }

  requestAnimationFrame(frame);
}

/* ---------- controls: fullscreen, idle cursor, keep screen awake ---------- */
const hint = document.getElementById('hint');
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  if (!document.fullscreenElement) hint.style.opacity = 1;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { document.body.classList.add('idle'); hint.style.opacity = 0; }, 3000);
}
async function goFull() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  hint.style.opacity = 0;
}
addEventListener('mousemove', wake);
addEventListener('click', goFull);
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') goFull();
  if (e.key === 'g' || e.key === 'G') {
    gaitKey = GAIT_ORDER[(GAIT_ORDER.indexOf(gaitKey) + 1) % GAIT_ORDER.length];
    hint.textContent = GAITS[gaitKey].name;
    hint.style.opacity = 1;
    clearTimeout(hint._t);
    hint._t = setTimeout(() => { hint.style.opacity = 0; hint.textContent = 'Click or press F for fullscreen'; }, 1800);
  }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && document.fullscreenElement) {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});

fogSprite = radialSprite([[0, 'rgba(140,0,12,0.55)'], [0.5, 'rgba(90,0,8,0.25)'], [1, 'rgba(60,0,4,0)']]);
glowSprite = radialSprite([[0, 'rgba(200,20,30,1)'], [0.5, 'rgba(120,0,10,0.4)'], [1, 'rgba(60,0,4,0)']]);
makeGrain();
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
resize();
nextFlash = performance.now() / 1000 + rand(6, 12);
wake();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
